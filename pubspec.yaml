name: ai_chat_image_app
description: "AI Chat & Image Generator App powered by OpenAI (GPT + DALL·E)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.1

  # State management
  provider: ^6.1.2

  # Environment variables (API keys)
  flutter_dotenv: ^5.1.0

  # Local chat history persistence
  shared_preferences: ^2.2.3

  # Date formatting in chat
  intl: ^0.19.0

  # Nice UUIDs for message ids
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
